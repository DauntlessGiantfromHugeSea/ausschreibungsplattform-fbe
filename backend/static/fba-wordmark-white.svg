<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" preserveAspectRatio="xMinYMid meet">
  <!-- FBA Mark links: weisser Block mit teal Schrift fuer Kontrast auf dark teal -->
  <rect x="2" y="6" width="78" height="78" rx="16" fill="#ffffff"/>
  <text x="41" y="58" text-anchor="middle" dominant-baseline="middle"
        font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-weight="800" font-size="34" fill="#003233" letter-spacing="-2">FBA</text>
  <!-- Wortmarke: zwei-zeilig wie im Akademie-Lockup -->
  <text x="96" y="42"
        font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="22" fill="#ffffff" letter-spacing="-0.3">Flüssigboden Akademie</text>
  <text x="96" y="66"
        font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-weight="500" font-size="14" fill="#d4f561" letter-spacing="2">AUSSCHREIBUNGEN</text>
