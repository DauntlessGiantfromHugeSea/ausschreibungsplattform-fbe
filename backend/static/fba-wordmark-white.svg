<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" preserveAspectRatio="xMinYMid meet">
  <!-- Geschwungenes B-Mark im FBA-Stil -->
  <g fill="#ffffff" transform="translate(8, 8)">
    <!-- Aeussere Hauptform: zwei uebereinanderliegende Schleifen -->
    <path d="
      M 0 0
      L 0 84
      L 38 84
      C 72 84 76 60 66 48
      C 56 38 32 38 14 38
      L 14 26
      C 30 26 56 26 62 18
      C 70 8 62 0 38 0
      Z" />
    <!-- Innerer Cutout obere Schleife (dunkler durchschein) -->
    <path d="M 22 14 L 22 26 L 36 26 C 50 26 52 14 36 14 Z" fill="#003233"/>
    <!-- Innerer Cutout untere Schleife -->
    <path d="M 22 50 L 22 72 L 36 72 C 56 72 58 50 36 50 Z" fill="#003233"/>
  </g>

  <!-- FBA-Schriftzug -->
  <text x="100" y="46"
        font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-weight="800" font-size="40" fill="#ffffff" letter-spacing="-1.5">FBA</text>
  <!-- Flüssigboden Akademie -->
  <text x="100" y="72"
        font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="18" fill="#ffffff" letter-spacing="-0.3">Flüssigboden Akademie</text>
  <!-- Subtitel in Lime -->
  <text x="100" y="92"
        font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-weight="500" font-size="11" fill="#d4f561" letter-spacing="3">AUSSCHREIBUNGEN</text>
</svg>
