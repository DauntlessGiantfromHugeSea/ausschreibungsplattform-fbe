<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}FBE Ausschreibungen{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f7f8fa; }
    .navbar-brand strong { color: #d35400; }
    .badge-high   { background: #c0392b; color: #fff; }
    .badge-medium { background: #e67e22; color: #fff; }
    .badge-low    { background: #95a5a6; color: #fff; }
    .relevance-dot {
      display: inline-block; width: 10px; height: 10px; border-radius: 50%;
      margin-right: 6px; vertical-align: middle;
    }
    .dot-high   { background: #c0392b; }
    .dot-medium { background: #e67e22; }
    .dot-low    { background: #95a5a6; }
    .table thead th { white-space: nowrap; }
    .truncate-2 {
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; max-width: 320px;
    }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand" href="/"><strong>FBE</strong> Ausschreibungsplattform</a>
    <div class="d-flex gap-2">
      <form action="/run-search" method="post" onsubmit="this.querySelector('button').disabled=true; this.querySelector('button').innerText='Suche läuft…';">
        <button class="btn btn-primary btn-sm" type="submit">Suche starten</button>
      </form>
      <a class="btn btn-outline-secondary btn-sm" href="/docs" target="_blank">API</a>
    </div>
  </div>
</nav>
<main class="container-fluid py-4">
  {% block content %}{% endblock %}
</main>
</body>
</html>
