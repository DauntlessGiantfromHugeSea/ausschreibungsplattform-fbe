{% extends "base.html" %}
{% block title %}Passwort vergessen – FBE{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-12">
  <div class="card p-6">
    <h1 class="text-xl font-semibold mb-2">Passwort vergessen</h1>
    <p class="text-sm text-zinc-500 mb-4">Reset-Link an deine hinterlegte E-Mail. 1 Stunde gültig.</p>
    {% if flash %}<div class="mb-4 text-sm text-emerald-800 bg-emerald-50 dark:bg-emerald-900/30 px-3 py-2 rounded-lg">{{ flash }}</div>{% endif %}
    <form method="post" action="/forgot-password" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-zinc-600 mb-1">Username oder E-Mail</label>
        <input class="input" type="text" name="identifier" required autocomplete="username" placeholder="user oder info@firma.de">
      </div>
      <button class="btn-primary w-full" type="submit">Reset-Link anfordern</button>
    </form>
    <a href="/login" class="text-xs text-zinc-500 hover:text-zinc-800 mt-3 block">← zurück zum Login</a>
  </div>
</div>
{% endblock %}
