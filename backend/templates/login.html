<!DOCTYPE html>
<html lang="de" class="h-full bg-zinc-50 dark:bg-zinc-900">
<head>
  <meta charset="UTF-8">
  <script>
    (function() {
      const saved = localStorage.getItem('theme');
      const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) document.documentElement.classList.add('dark');
    })();
  </script>
  <title>Anmelden – FBE Ausschreibungen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if has_logo() %}
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="shortcut icon" href="/static/favicon.png">
  <link rel="apple-touch-icon" href="/static/favicon.png">
  {% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode:'class',
      theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'] },
      colors: { brand: { 500:'#3b5b86', 700:'#27406b', 800:'#1f3556' } } } } }
  </script>
  <style>
    body{font-family:Inter,system-ui,sans-serif}
    .dark body { background-color: rgb(24 24 27); color: rgb(244 244 245); }
    .dark .bg-white { background-color: rgb(39 39 42) !important; }
    .dark .border-zinc-200, .dark .border-zinc-200\/70, .dark .border-zinc-300 { border-color: rgb(63 63 70) !important; }
    .dark input { background-color: rgb(24 24 27) !important; color: rgb(244 244 245) !important; border-color: rgb(82 82 91) !important; }
    .dark .text-zinc-900 { color: rgb(244 244 245) !important; }
    .dark .text-zinc-700, .dark .text-zinc-600, .dark .text-zinc-500, .dark .text-zinc-400 { color: rgb(161 161 170) !important; }
    .dark .bg-rose-50 { background-color: rgb(76 5 25 / 0.4) !important; }
    .dark .text-rose-800 { color: rgb(254 205 211) !important; }
    .dark .border-rose-200 { border-color: rgb(136 19 55) !important; }
    .dark .bg-emerald-50 { background-color: rgb(6 78 59 / 0.35) !important; }
    .dark .text-emerald-800 { color: rgb(167 243 208) !important; }
    .dark .border-emerald-200 { border-color: rgb(6 95 70) !important; }
  </style>
</head>
<body class="h-full text-zinc-900 dark:text-zinc-100 flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-6">
      {% if has_logo() %}
      <img src="/static/fbe-logo.png" alt="FBE" class="mx-auto h-14 w-auto">
      {% else %}
      <span class="inline-flex h-12 w-12 items-center justify-center rounded-xl bg-brand-700 text-white text-base font-semibold">FBE</span>
      {% endif %}
      <h1 class="mt-3 text-xl font-semibold">Ausschreibungsplattform</h1>
      <p class="text-sm text-zinc-500">Bitte anmelden</p>
    </div>

    <form method="post" action="/login" class="bg-white rounded-2xl border border-zinc-200/70 shadow-sm p-6 space-y-4">
      {% if flash %}
        <div class="rounded-lg border border-emerald-200 bg-emerald-50 px-3 py-2 text-sm text-emerald-800">
          ✓ {{ flash }}
        </div>
      {% endif %}
      {% if error %}
        <div class="rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-800">
          {{ error }}
        </div>
      {% endif %}
      <input type="hidden" name="next" value="{{ next or '/' }}">
      <div>
        <label class="block text-xs font-medium text-zinc-600 mb-1">Benutzername</label>
        <input class="w-full rounded-lg border border-zinc-300 bg-white px-3 py-2 text-sm
                      shadow-sm focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 focus:outline-none"
               type="text" name="username" autofocus required autocomplete="username">
      </div>
      <div>
        <label class="block text-xs font-medium text-zinc-600 mb-1">Passwort</label>
        <input class="w-full rounded-lg border border-zinc-300 bg-white px-3 py-2 text-sm
                      shadow-sm focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 focus:outline-none"
               type="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit"
              class="w-full inline-flex items-center justify-center rounded-lg px-3.5 py-2
                     text-sm font-medium shadow-sm bg-brand-700 text-white hover:bg-brand-800">
        Anmelden
      </button>
    
<a href="/forgot-password" class="block text-xs text-zinc-500 hover:text-zinc-800 mt-3 text-center">Passwort vergessen?</a>
</form>

    <p class="text-xs text-zinc-400 text-center mt-6">
      Flüssigboden Engineering · interne Auswertung
    </p>
  </div>
</body>
</html>
