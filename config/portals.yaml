- name: bi-medien Bauausschreibungen
  enabled: false
  scraper: rss_generic
  base_url: https://www.bi-medien.de
  strategy: rss
  notes: 'Vorlage: bi-medien (Fachverlag Bau) verlinkt auf der Webseite

    RSS-Feeds zu Bauausschreibungen / Tiefbau. Vor Aktivierung die

    tatsaechliche Feed-URL pruefen (variiert nach Verlagsangebot).

    In der Vergangenheit war /feeds/ausschreibungen.xml gaengig.

    '
  config:
    user_agent: Mozilla/5.0 (X11; Linux x86_64; rv:120.0) Gecko/20100101 Firefox/120.0
    feed_urls:
    - https://www.bi-medien.de/feeds/ausschreibungen.xml
    filter_by_terms: true
    max_items_per_feed: 200
- name: bund.de RSS-Feed (Ausschreibungen)
  enabled: true
  scraper: rss_generic
  base_url: https://www.service.bund.de
  strategy: rss
  notes: 'Offizieller RSS-Feed des Bundesverwaltungsamts mit allen
    aktuellen Ausschreibungen.

    Liefert pro Eintrag Titel + Link + Beschreibung + pubDate. Der
    Feed ist nicht vorgefiltert auf Bauleistungen - wir filtern
    client-seitig auf die FBE-Cluster-Begriffe. Detailseiten werden
    NICHT vom Scraper geladen - der KI-Enricher uebernimmt das
    automatisch (Chromium-Render + LLM-Extraktion) sobald die Tender
    in der DB sind.

    Laeuft parallel zum vorhandenen ''bund.de Service-Portal''-Scraper
    (HTML-Suchseite). Doppelte URLs werden ueber den fingerprint-Index
    in der DB nicht zweimal angelegt.

    '
  config:
    user_agent: Mozilla/5.0 (X11; Linux x86_64; rv:120.0) Gecko/20100101 Firefox/120.0
    feed_urls:
    - https://www.service.bund.de/Content/Globals/Functions/RSSFeed/RSSGenerator_Ausschreibungen.xml
    filter_by_terms: true
    max_items_per_feed: 300
- name: TED RSS-Feed (DE)
  enabled: false
  scraper: rss_generic
  base_url: https://ted.europa.eu
  strategy: rss
  notes: 'Vorlage: TED hat dokumentierte RSS-Feeds, das aktuelle URL-Format

    aendert sich aber zwischen v2 und v3. Vor Aktivierung: bei TED

    auf der Static-Page einen aktuellen Feed-Link ziehen

    (https://ted.europa.eu/en/static-page/rss) und hier eintragen.

    Aktuell ueberlappt das Ergebnis mit der TED-API; deshalb

    standardmaessig deaktiviert.

    '
  config:
    user_agent: Mozilla/5.0 (X11; Linux x86_64; rv:120.0) Gecko/20100101 Firefox/120.0
    feed_urls:
    - https://ted.europa.eu/udl?uri=TED:RSS:All:DE&action=display
    filter_by_terms: true
    max_items_per_feed: 200
- name: Subreport ELViS
  enabled: false
  scraper: subreport
  base_url: https://www.subreport.de
  strategy: scrape
  notes: Login/Account erforderlich. Spezial-Scraper noetig.
- name: DB Vergabeportal
  enabled: true
  scraper: playwright_html
  base_url: https://bieterportal.noncd.db.de
  strategy: scrape
  notes: "Bieterportal Deutsche Bahn AG (Healy-Hudson eVergabe, gleiche\nEngine wie DTVP). Listing der oeffentlichen Bekanntmachungen\nunter /evergabe.bieter/eva/supplierportal/portal. JS-rendered -\nbraucht Playwright (Headless-Chromium).\n\nAuf VPS einmalig:\n    source .venv/bin/activate\n    pip install playwright\n    playwright install chromium\n\nFalls Playwright nicht installiert ist, gibt der Scraper einen\nklaren Hinweis und blockt nicht die anderen Portale.\n"
  config:
    user_agent: Mozilla/5.0 (X11; Linux x86_64; rv:120.0) Gecko/20100101 Firefox/120.0
    timeout: 60
    search_path: /evergabe.bieter/eva/supplierportal/portal
    wait_for_selector: 'table.notice-list, table.results, table.searchResults, .project-list, .search-result, .notice-result, a[href*=''/notice''], a[href*=''/Verfahren''], a[href*=''/Bekanntmachung''], tr.notice, tr.publication, [class*=''notice-item''], [class*=''result-row'']

      '
    wait_timeout_ms: 25000
    filter_by_terms: true
    result_selector: 'tr.notice, tr.publication, tr.result-row, table.notice-list tbody tr, table.searchResults tbody tr, table.results tbody tr, .project-list-row, .search-result-row, .notice-result, [class*=''notice-item''], [class*=''publication-item''], article.notice, li.notice

      '
    title_selector: 'a.notice-title, a.publication-title, a.title, h2 a, h3 a, td a[href*=''/notice''], td a[href*=''/Verfahren''], td a[href*=''/Bekanntmachung''], td a

      '
    authority_selector: .buyer, .vergabestelle, .auftraggeber, .organisation
    location_selector: .place, .ort, .erfuellungsort, .location
    deadline_selector: .deadline, .frist, .angebotsfrist, .submissionDeadline
    description_selector: .description, .excerpt, .summary, p
- name: Vergabe24 (Cosinex)
  enabled: false
  scraper: cosinex
  base_url: https://www.vergabe24.de
  strategy: scrape
  notes: 'Vorlage: Vergabe24 ist ein Cosinex-Vergabeplattform-Aggregator.

    Aktivierung: enabled: true setzen, dann ueber /admin/status

    pruefen ob die Welcome-Page-Tabelle erkannt wird. Falls nicht,

    listing_paths anpassen.

    '
  config:
    variant: center
    max_pages: 2
    filter_by_terms: true
- name: myFUTURA (Futura Solutions)
  enabled: true
  scraper: generic_html
  base_url: https://www.myfutura.eu
  strategy: scrape
  notes: "myFUTURA ist eine SAP-native Sourcing-Plattform der Futura Solutions\nGmbH (Wiesbaden). Das Bietermodul liegt unter\n/myfutura/bietermodul/maincontroller.php und ist primaer login-\ngeschuetzt - oeffentliche Bekanntmachungen werden vom jeweiligen\nMandanten dort eingestellt (z.B. n-ergie, RWE, BASF).\n\nUmsetzung: generic_html im Listing-Modus probiert mehrere\nEinstiegspfade (Bietermodul, public-notice-Liste, Login-Page mit\nNotices-Block). Wenn keiner Bekanntmachungs-Karten liefert, springt\nder Auto-Discovery-Fallback im Scraper auf gaengige Pfade an\n(/ausschreibungen, /notices ...).\n\nFalls das Portal nur per Login Karten zeigt, /admin/status pruefen:\nhttp_log zeigt dann 200 + 0 Treffer. In dem Fall braucht die\nAnbindung credentials -> playwright_html mit Login-Schritt\n(analog Subreport ELViS, separat zu konfigurieren).\n"
  config:
    user_agent: Mozilla/5.0 (X11; Linux x86_64; rv:120.0) Gecko/20100101 Firefox/120.0
    timeout: 45
    request_delay_s: 0.5
    listing_paths:
    - /myfutura/bietermodul/maincontroller.php
    - /4build/loginnopopup.phtml
