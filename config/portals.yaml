# =====================================================================
# Konfigurierte Ausschreibungsportale - DEUTSCHLAND
# =====================================================================
#
# Architektur-Hinweis:
#   Viele Laenderportale teilen sich eine Backend-Engine. Selektoren sind
#   deshalb pro "Engine-Familie" sehr aehnlich. Im Zweifel direkt im
#   Browser (F12 -> Element untersuchen) auf der Trefferseite pruefen
#   und ueber /admin/portals/{name}/edit anpassen.
#
#   Engine-Familien:
#     1. Cosinex VMP Satellite -> /VMPSatellite/notice/search?searchTerm=X
#        Brandenburg, Sachsen-Anhalt, Thueringen, Schleswig-Holstein,
#        Mecklenburg-Vorpommern (teilweise)
#     2. Cosinex VMP Center    -> /VMPCenter/notice/search?searchTerm=X
#        NRW, Rheinland-Pfalz, Saarland, Hamburg
#     3. Vergabemarktplatz Berlin (Spezial)
#     4. evergabe.sachsen.de (NetServer)
#     5. DTVP (Healy-Hudson)
#     6. evergabe.de / evergabe-online.de (Bund/Cosinex)
#     7. Auftragsboerse Bayern
#
# Felder:
#   strategy : api | rss | search_url | scrape
#   scraper  : Modulname unter scrapers/ (snake_case -> CamelCaseScraper)

portals:

  # =====================================================================
  # Bund / EU - hochwertig, eigene Scraper
  # =====================================================================

  - name: "bund.de Service-Portal"
    enabled: true
    scraper: "bund"
    base_url: "https://www.service.bund.de"
    strategy: "search_url"
    notes: |
      Bekanntmachungen des Bundes. Standard-Listing liefert mit einem
      Request 100 frische Items, sortiert nach Veroeffentlichungsdatum.
      Per query_term wird zusaetzlich serverseitig gefiltert.
    config:
      max_pages: 2
      enable_keyword_search: true
      filter_by_terms: true
      request_delay_s: 0.4
      listing_params:
        resultsPerPage: 100
        sortOrder: "dateOfIssue_dt desc"

  - name: "TED - Tenders Electronic Daily"
    enabled: true
    scraper: "ted"
    base_url: "https://api.ted.europa.eu"
    strategy: "api"
    notes: "Offizielle TED Search API v3 - kein Key noetig."

  # =====================================================================
  # Bundesweite Cosinex / Bekanntmachungs-Portale
  # =====================================================================

  - name: "evergabe.de (Cosinex)"
    enabled: true
    scraper: "generic_html"
    base_url: "https://www.evergabe.de"
    strategy: "search_url"
    notes: |
      Next.js-SPA - aber serverseitig vorgerendert. Probe-Diagnose hat
      bestaetigt: /auftraege/auftrag-suchen rendert die Trefferkarten
      direkt in #results-list-container. Wir nehmen jedes direkte Kind
      als Treffer und ziehen Felder per Label-Match aus dem Karten-Volltext.
      Pro query_term ein Request mit ?search[query]=...
    config:
      search_path: "/auftraege/auftrag-suchen?search%5Bquery%5D={term}&search%5Bper_page%5D=50&search%5Bsort_order%5D=best"
      # Server filtert serverseitig auf {term}, Client-Filter spart die
      # extra Pruefung - wir uebernehmen alle 50 Treffer pro Suche.
      filter_by_terms: false
      result_selector: "#results-list-container > article, #results-list-container > div, #results-list-container > section, #results-list-container > li"
      title_selector: "h2 a, h3 a, h2, h3, [class*='title'] a, a[href*='/auftrag/']"
      description_selector: "p, [class*='description'], [class*='excerpt'], [class*='summary']"

  - name: "evergabe-online.de (BMI)"
    enabled: true
    scraper: "crawl_html"
    base_url: "https://www.evergabe-online.de"
    strategy: "scrape"
    notes: "Bund-Laender-Plattform der Beschaffungsstelle des BMI - Crawl-Modus."
    config:
      listing_paths:
        - "/search.html?searchScope=ANNOUNCEMENT"
      link_selector: "a[href*='/announcement/'], a[href*='/notice/'], a.searchResultLink"
      max_details: 60
      request_delay_s: 0.5
      detail_title_selector: "h1, .title, .announcement-title"
      detail_authority_selector: ".authority, .buyer, .vergabestelle"
      detail_location_selector: ".place, .location, .ort"
      detail_deadline_selector: ".deadline, .frist, .submissionDeadline"
      detail_publication_selector: ".publicationDate, .published"

  - name: "DTVP - Deutsches Vergabeportal"
    enabled: true
    scraper: "playwright_html"
    base_url: "https://www.dtvp.de"
    strategy: "scrape"
    notes: |
      DTVP ist eine SPA - der Suchstand liegt in einem base64-codierten
      Hash-Fragment, das clientseitig in eine API-Anfrage uebersetzt wird.
      Wir nutzen Playwright (Headless-Chromium), bauen das Hash-JSON
      pro Suchbegriff und lassen den Browser die Seite vollstaendig
      rendern. Voraussetzung: pip install playwright && playwright install chromium.
    config:
      search_path: "/Center/common/project/search.do?method=showExtendedSearch&fromExternal=true#{hash}"
      hash_json:
        cpvCodes: []
        contractingRules: ["VOL", "VOB", "VSVGV", "SEKTVO", "OTHER"]
        publicationTypes: ["Tender"]
        distance: 0
        postalCode: ""
        order: "0"
        page: "1"
        searchText: "{term}"
        sortField: "rank"
      wait_for_selector: ".project-list, .search-result, table.results, [class*='result']"
      wait_timeout_ms: 15000
      filter_by_terms: false
      result_selector: ".project-list-row, .search-result-row, tr.result, [class*='project-row'], [class*='result-row']"
      title_selector: "a.project-title, a.notice-title, a.title, h2 a, h3 a, a"
      authority_selector: ".buyer-name, .organisation, .buyer, .vergabestelle"
      location_selector: ".place, .location, .ort"
      deadline_selector: ".deadline, .submission-deadline, .frist, .angebotsfrist"
      description_selector: ".description, .excerpt, .summary"

  # =====================================================================
  # Bundeslaender (alphabetisch)
  # =====================================================================

  - name: "Vergabe Baden-Württemberg"
    enabled: true
    scraper: "crawl_html"
    base_url: "https://vergabe.bwl.de"
    strategy: "scrape"
    notes: |
      Baden-Wuerttemberg hat keine offene URL-Suche. Wir crawlen die
      Landingpage und uebliche Listing-Pfade, folgen Detail-Links und
      filtern client-seitig auf die Cluster-Begriffe.
    config:
      user_agent: "Mozilla/5.0 (X11; Linux x86_64; rv:120.0) Gecko/20100101 Firefox/120.0"
      listing_paths:
        - "/"
        - "/ausschreibungen"
        - "/bekanntmachungen"
      link_selector: "a[href]"
      link_pattern: "(ausschreibung|bekanntmachung|notice|tender|vergabe|auftrag)"
      max_details: 30
      request_delay_s: 0.5
      detail_title_selector: "h1, .title"
      detail_authority_selector: ".vergabestelle, .buyer, .auftraggeber"
      detail_location_selector: ".ort, .place, .erfuellungsort"
      detail_deadline_selector: ".frist, .deadline, .angebotsfrist"

  - name: "Auftragsbörse Bayern"
    enabled: true
    scraper: "crawl_html"
    base_url: "https://www.auftraege.bayern.de"
    strategy: "scrape"
    notes: |
      Bayerische Auftragsboerse hat keine stabile Such-URL-API. Crawl
      ueber Landingpage + uebliche Listing-Pfade, dann Volltext-Filter.
    config:
      user_agent: "Mozilla/5.0 (X11; Linux x86_64; rv:120.0) Gecko/20100101 Firefox/120.0"
      listing_paths:
        - "/"
        - "/index.php"
        - "/ausschreibungen"
        - "/bekanntmachungen"
      link_selector: "a[href]"
      link_pattern: "(bekanntmachung|ausschreibung|auftrag|notice|tender)"
      max_details: 30
      request_delay_s: 0.5
      detail_title_selector: "h1, .title, td.title"
      detail_authority_selector: ".vergabestelle, .buyer, .auftraggeber"
      detail_location_selector: ".ort, .place"
      detail_deadline_selector: ".frist, .deadline, .angebotsfrist"

  - name: "Vergabeplattform Berlin"
    enabled: true
    scraper: "cosinex"
    base_url: "https://vergabeplattform.berlin.de"
    strategy: "scrape"
    notes: "Berlin VMP Satellite - Listing-Crawl mit Term-Filter."
    config:
      variant: "satellite"
      max_pages: 3
      filter_by_terms: true

  - name: "Vergabemarktplatz Brandenburg"
    enabled: true
    scraper: "cosinex"
    base_url: "https://vergabemarktplatz.brandenburg.de"
    strategy: "scrape"
    notes: "Brandenburg VMP Satellite - Listing-Crawl mit Term-Filter."
    config:
      variant: "satellite"
      max_pages: 3
      filter_by_terms: true

  - name: "Vergabe Bremen"
    enabled: true
    scraper: "crawl_html"
    base_url: "https://vergabe.bremen.de"
    strategy: "scrape"
    notes: |
      Bremen hat keine offen dokumentierte Such-URL. Listing-Crawl
      ueber die Landingpage und uebliche Pfade, dann Volltext-Filter.
    config:
      user_agent: "Mozilla/5.0 (X11; Linux x86_64; rv:120.0) Gecko/20100101 Firefox/120.0"
      listing_paths:
        - "/"
        - "/ausschreibungen"
        - "/bekanntmachungen"
      link_selector: "a[href]"
      link_pattern: "(ausschreibung|bekanntmachung|notice|auftrag)"
      max_details: 30
      request_delay_s: 0.5
      detail_title_selector: "h1, .title"
      detail_authority_selector: ".vergabestelle, .buyer"
      detail_location_selector: ".ort, .place"
      detail_deadline_selector: ".frist, .deadline"

  - name: "Vergabe Hamburg"
    enabled: true
    scraper: "cosinex"
    base_url: "https://vergabe.hamburg.de"
    strategy: "scrape"
    notes: "Hamburg VMP Center - Listing-Crawl mit Term-Filter."
    config:
      variant: "center"
      max_pages: 3
      filter_by_terms: true

  - name: "Vergabe Hessen (HAD)"
    enabled: true
    scraper: "crawl_html"
    base_url: "https://www.had.de"
    strategy: "scrape"
    notes: |
      Hessen Ausschreibungsdatenbank (HAD). vergabe.hessen.de leitet
      auf had.de um. Listing-Crawl + Volltext-Filter.
    config:
      user_agent: "Mozilla/5.0 (X11; Linux x86_64; rv:120.0) Gecko/20100101 Firefox/120.0"
      listing_paths:
        - "/ausschreibungen.html"
        - "/ausschreibungen-suche.html"
        - "/"
      link_selector: "a[href*='ausschreibung'], a[href*='had_id'], a[href*='detail']"
      max_details: 40
      request_delay_s: 0.5
      detail_title_selector: "h1, .title, .had-title"
      detail_authority_selector: ".vergabestelle, .auftraggeber"
      detail_location_selector: ".ort, .erfuellungsort"
      detail_deadline_selector: ".frist, .angebotsfrist"

  - name: "Vergabe Mecklenburg-Vorpommern"
    enabled: true
    scraper: "cosinex"
    base_url: "https://www.vergabe-mv.de"
    strategy: "scrape"
    notes: "MV VMP Satellite - Listing-Crawl mit Term-Filter."
    config:
      variant: "satellite"
      max_pages: 3
      filter_by_terms: true

  - name: "Vergabe Niedersachsen"
    enabled: true
    scraper: "crawl_html"
    base_url: "https://vergabe.niedersachsen.de"
    strategy: "scrape"
    notes: |
      Niedersachsen-Vergabe - eigenes Portal. Listing-Crawl ueber
      Veroeffentlichungs-Pfade + Volltext-Filter.
    config:
      user_agent: "Mozilla/5.0 (X11; Linux x86_64; rv:120.0) Gecko/20100101 Firefox/120.0"
      listing_paths:
        - "/Veroeffentlichungen"
        - "/veroeffentlichungen"
        - "/"
      link_selector: "a[href*='Veroeffentlichung'], a[href*='bekanntmachung'], a[href*='detail']"
      max_details: 40
      request_delay_s: 0.5
      detail_title_selector: "h1, .title"
      detail_authority_selector: ".vergabestelle, .auftraggeber"
      detail_location_selector: ".ort, .erfuellungsort"
      detail_deadline_selector: ".frist, .angebotsfrist"

  - name: "Vergabe Nordrhein-Westfalen"
    enabled: true
    scraper: "cosinex"
    base_url: "https://www.evergabe.nrw.de"
    strategy: "scrape"
    notes: "NRW VMP Center - Listing-Crawl mit Term-Filter."
    config:
      variant: "center"
      max_pages: 3
      filter_by_terms: true

  - name: "Vergabe Rheinland-Pfalz"
    enabled: true
    scraper: "cosinex"
    base_url: "https://vergabe.rlp.de"
    strategy: "scrape"
    notes: "RLP VMP Center - Listing-Crawl mit Term-Filter."
    config:
      variant: "center"
      max_pages: 3
      filter_by_terms: true

  - name: "Vergabe Saarland"
    enabled: true
    scraper: "cosinex"
    base_url: "https://vergabe.saarland.de"
    strategy: "scrape"
    notes: "Saarland VMP Center - Listing-Crawl mit Term-Filter."
    config:
      variant: "center"
      max_pages: 3
      filter_by_terms: true

  - name: "Vergabe Sachsen"
    enabled: true
    scraper: "sachsen"
    base_url: "https://www.evergabe.sachsen.de"
    strategy: "search_url"
    notes: |
      evergabe.sachsen.de NetServer (AI Informatics) - dedizierter Scraper.
      Pro query_term ein Search.SearchPattern-Request auf
      /NetServer/PublicationSearchControllerServlet, mit Pagination.
      Wenn die Suche leer bleibt, faellt der Scraper auf das ungefilterte
      InvitationToTender-Listing zurueck und filtert client-seitig auf
      die Cluster-Begriffe.
    config:
      search_path: "/NetServer/PublicationSearchControllerServlet?function=SearchPublications&Category=InvitationToTender&thContext=publications"
      max_pages: 3
      max_details: 0
      request_delay_s: 0.4

  - name: "Vergabe Sachsen-Anhalt"
    enabled: true
    scraper: "cosinex"
    base_url: "https://www.evergabe.sachsen-anhalt.de"
    strategy: "scrape"
    notes: "Sachsen-Anhalt VMP Satellite - Listing-Crawl mit Term-Filter."
    config:
      variant: "satellite"
      max_pages: 3
      filter_by_terms: true

  - name: "Vergabe Schleswig-Holstein"
    enabled: true
    scraper: "cosinex"
    base_url: "https://www.vergabe-sh.de"
    strategy: "scrape"
    notes: "SH VMP Satellite - Listing-Crawl mit Term-Filter."
    config:
      variant: "satellite"
      max_pages: 3
      filter_by_terms: true

  - name: "Vergabe Thüringen"
    enabled: true
    scraper: "cosinex"
    base_url: "https://www.evergabe-thueringen.de"
    strategy: "scrape"
    notes: "Thueringen VMP Satellite - Listing-Crawl mit Term-Filter."
    config:
      variant: "satellite"
      max_pages: 3
      filter_by_terms: true

  # =====================================================================
  # Login-/JS-pflichtig - spaeter mit Spezial-Scraper
  # =====================================================================

  - name: "Subreport ELViS"
    enabled: false
    scraper: "subreport"
    base_url: "https://www.subreport.de"
    strategy: "scrape"
    notes: "Login/Account erforderlich. Spezial-Scraper noetig."

  - name: "DB Vergabeportal"
    enabled: false
    scraper: "db_vergabe"
    base_url: "https://bieterportal.noncd.db.de"
    strategy: "scrape"
    notes: "JS-rendered, Playwright noetig."

  - name: "Vergabe24 (Cosinex)"
    enabled: false
    scraper: "generic_html"
    base_url: "https://www.vergabe24.de"
    strategy: "search_url"
    notes: "Sessions/Cookies oft erforderlich. Selektoren testen."
    config:
      search_path: "/?searchterm={term}"
      result_selector: "div.notice-result, li.result"
      title_selector: "a.title, h3 a"
      authority_selector: ".buyer"
      deadline_selector: ".deadline"
