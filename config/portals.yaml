# Konfigurierte Ausschreibungsportale.
#
# strategy:
#   api         - offizielle JSON/REST API
#   rss         - RSS-Feed
#   search_url  - serverseitig gerendertes HTML-Suchformular
#   scrape      - generisches HTML-Scraping
#
# scraper-Module sind unter scrapers/<modul>.py.
# Klassenname-Konvention: snake_case -> CamelCase + 'Scraper'
#   z.B. 'rss_generic' -> 'RssGenericScraper'
#
# Hinweis fuer alle generic_html-Eintraege:
#   Die search_path / Selektoren sind aktuelle, aber ungetestete
#   Annahmen. Wenn ein Portal sein Layout aendert, einfach im Browser
#   die Suchergebnis-Seite oeffnen, F12 -> Element untersuchen, und
#   den passenden CSS-Selektor hier eintragen.

portals:

  # =========================================================
  # Bund / EU - solide implementiert
  # =========================================================

  - name: "bund.de Service-Portal"
    enabled: true
    scraper: "bund"
    base_url: "https://www.service.bund.de"
    strategy: "search_url"
    notes: "Service-Portal des Bundes - eigener Scraper, stabil."

  - name: "TED - Tenders Electronic Daily"
    enabled: true
    scraper: "ted"
    base_url: "https://api.ted.europa.eu"
    strategy: "api"
    notes: "Offizielle TED Search API v3 - kein Key noetig."

  # =========================================================
  # Bund / Bundesweit
  # =========================================================

  - name: "evergabe-online.de (Bund)"
    enabled: true
    scraper: "generic_html"
    base_url: "https://www.evergabe-online.de"
    strategy: "search_url"
    notes: "Bundesweite Plattform der BMI. Selektoren ggf. nachziehen."
    config:
      search_path: "/search.html?searchScope=ANNOUNCEMENT&inputSearchterm={term}"
      result_selector: "div.result, li.search-result, tr.searchResult"
      title_selector: "a.title, h3 a, a.search-result-title"
      authority_selector: ".authority, .vergabestelle, .buyer"
      location_selector: ".place, .ort, .location"
      deadline_selector: ".deadline, .frist, .endTime"
      publication_selector: ".publication, .veroeffentlicht"
      description_selector: ".excerpt, .description"

  - name: "DTVP - Deutsches Vergabeportal"
    enabled: true
    scraper: "generic_html"
    base_url: "https://www.dtvp.de"
    strategy: "search_url"
    notes: "Healy-Hudson-Portal, oeffentliche Suche."
    config:
      search_path: "/Center/notices?fulltext={term}"
      result_selector: "div.notice-tile, tr.notice-row, li.notice"
      title_selector: "a.title, a.notice-title, h3 a"
      authority_selector: ".buyer-name, .organisation"
      location_selector: ".place, .location"
      deadline_selector: ".deadline, .submission-deadline"

  # =========================================================
  # Laenderportale (Schwerpunkt Mittel-/Ostdeutschland fuer FBE)
  # =========================================================

  - name: "Vergabemarktplatz Brandenburg"
    enabled: true
    scraper: "generic_html"
    base_url: "https://vergabemarktplatz.brandenburg.de"
    strategy: "search_url"
    notes: "Vergabemarktplatz-Engine (AI Informatics)."
    config:
      search_path: "/VMPSatellite/notice/search?searchTerm={term}"
      result_selector: "div.notice-result, tr.notice"
      title_selector: "a.notice-title, a.title"
      authority_selector: ".buyer, .vergabestelle"
      location_selector: ".place, .ort"
      deadline_selector: ".deadline, .frist"

  - name: "Vergabeplattform Berlin"
    enabled: true
    scraper: "generic_html"
    base_url: "https://vergabeplattform.berlin.de"
    strategy: "search_url"
    notes: "Vergabemarktplatz-Engine."
    config:
      search_path: "/VMPCenter/notice/search?searchTerm={term}"
      result_selector: "div.notice-result, tr.notice"
      title_selector: "a.notice-title, a.title"
      authority_selector: ".buyer, .vergabestelle"
      location_selector: ".place, .ort"
      deadline_selector: ".deadline, .frist"

  - name: "Vergabeplattform Sachsen"
    enabled: true
    scraper: "generic_html"
    base_url: "https://www.evergabe.sachsen.de"
    strategy: "search_url"
    notes: "evergabe.sachsen.de"
    config:
      search_path: "/NetServer/PublicationSearchControllerServlet?function=SearchPublications&searchterm={term}"
      result_selector: "tr.publication-row, div.notice-result"
      title_selector: "a.publication-title, a.title"
      authority_selector: "td.buyer, .vergabestelle"
      location_selector: "td.place, .ort"
      deadline_selector: "td.deadline, .frist"

  - name: "Vergabe Sachsen-Anhalt"
    enabled: true
    scraper: "generic_html"
    base_url: "https://www.evergabe.sachsen-anhalt.de"
    strategy: "search_url"
    notes: "Sachsen-Anhalt Vergabemarktplatz."
    config:
      search_path: "/VMPSatellite/notice/search?searchTerm={term}"
      result_selector: "div.notice-result, tr.notice"
      title_selector: "a.notice-title, a.title"
      authority_selector: ".buyer, .vergabestelle"
      location_selector: ".place, .ort"
      deadline_selector: ".deadline"

  - name: "Vergabeplattform Thueringen"
    enabled: true
    scraper: "generic_html"
    base_url: "https://www.evergabe-thueringen.de"
    strategy: "search_url"
    notes: "Thueringen Vergabe."
    config:
      search_path: "/VMPSatellite/notice/search?searchTerm={term}"
      result_selector: "div.notice-result, tr.notice"
      title_selector: "a.notice-title, a.title"
      authority_selector: ".buyer, .vergabestelle"
      location_selector: ".place, .ort"
      deadline_selector: ".deadline"

  - name: "Vergabe Mecklenburg-Vorpommern"
    enabled: true
    scraper: "generic_html"
    base_url: "https://www.service.mv-regierung.de"
    strategy: "search_url"
    notes: "Vergabeplattform MV. URL-Pattern moeglicherweise abweichend."
    config:
      search_path: "/Vergabe/_search?q={term}"
      result_selector: "div.search-result, li.notice"
      title_selector: "a.title, h3 a"
      authority_selector: ".buyer, .vergabestelle"
      location_selector: ".place, .ort"
      deadline_selector: ".deadline, .frist"

  - name: "Vergabeplattform NRW"
    enabled: true
    scraper: "generic_html"
    base_url: "https://www.evergabe.nrw.de"
    strategy: "search_url"
    notes: "Vergabe NRW (Cosinex)."
    config:
      search_path: "/VMPCenter/notice/search?fulltext={term}"
      result_selector: "div.notice-result, tr.notice"
      title_selector: "a.notice-title, a.title"
      authority_selector: ".buyer, .vergabestelle"
      location_selector: ".place, .ort"
      deadline_selector: ".deadline, .frist"

  - name: "Vergabe Niedersachsen"
    enabled: true
    scraper: "generic_html"
    base_url: "https://www.vergabe.niedersachsen.de"
    strategy: "search_url"
    notes: "Niedersachsen Vergabe."
    config:
      search_path: "/Veroeffentlichungen?searchterm={term}"
      result_selector: "div.search-result, li.notice"
      title_selector: "a.title, h3 a"
      authority_selector: ".buyer, .vergabestelle"
      location_selector: ".place, .ort"
      deadline_selector: ".deadline, .frist"

  - name: "Vergabe Bayern"
    enabled: true
    scraper: "generic_html"
    base_url: "https://www.vergabe.bayern.de"
    strategy: "search_url"
    notes: "Bayern Auftragsboerse."
    config:
      search_path: "/auftragsboerse/?q={term}"
      result_selector: "article.search-result, li.notice, div.result"
      title_selector: "a.title, h3 a"
      authority_selector: ".buyer, .vergabestelle"
      location_selector: ".place, .ort"
      deadline_selector: ".deadline, .frist"

  - name: "Vergabe Hessen"
    enabled: true
    scraper: "generic_html"
    base_url: "https://vergabe.hessen.de"
    strategy: "search_url"
    notes: "Hessen Vergabe."
    config:
      search_path: "/?searchterm={term}"
      result_selector: "div.search-result, li.result"
      title_selector: "a.title, h3 a"
      authority_selector: ".buyer, .vergabestelle"
      location_selector: ".place, .ort"
      deadline_selector: ".deadline, .frist"

  # =========================================================
  # Spaeter / mit Spezial-Scraper
  # =========================================================

  - name: "Subreport ELViS"
    enabled: false
    scraper: "subreport"
    base_url: "https://www.subreport.de"
    strategy: "scrape"
    notes: "Login/Account erforderlich. Spezial-Scraper noetig."

  - name: "Deutsche eVergabe (cosinex)"
    enabled: false
    scraper: "deutsche_evergabe"
    base_url: "https://www.deutsche-evergabe.de"
    strategy: "api"
    notes: "Registrierung & API-Key noetig."

  - name: "DB Vergabeportal"
    enabled: false
    scraper: "db_vergabe"
    base_url: "https://bieterportal.noncd.db.de"
    strategy: "scrape"
    notes: "JS-rendered, Playwright noetig."

  - name: "Vergabe24 (Cosinex)"
    enabled: false
    scraper: "generic_html"
    base_url: "https://www.vergabe24.de"
    strategy: "search_url"
    notes: "Funktioniert oft erst nach Cookie/Session - Selektoren testen."
    config:
      search_path: "/?searchterm={term}"
      result_selector: "div.notice-result, li.result"
      title_selector: "a.title, h3 a"
      authority_selector: ".buyer"
      deadline_selector: ".deadline"
