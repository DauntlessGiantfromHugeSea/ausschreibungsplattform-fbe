        - "/VMPSatellite/notice?page=2"
      filter_by_terms: true
      result_selector: "tr.publication, table.publications tbody tr, div.notice-result, tr.notice, li.notice, article, [class*='notice-item'], [class*='publication']"
      title_selector: "a.notice-title, a.title, td a, h2 a, h3 a, h2, h3, a"
      description_selector: ".description, .excerpt, p"

