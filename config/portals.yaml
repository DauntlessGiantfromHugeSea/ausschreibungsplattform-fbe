# =====================================================================
# Konfigurierte Ausschreibungsportale - DEUTSCHLAND
# =====================================================================
#
# Architektur-Hinweis:
#   Viele Laenderportale teilen sich eine Backend-Engine. Selektoren sind
#   deshalb pro "Engine-Familie" sehr aehnlich. Im Zweifel direkt im
#   Browser (F12 -> Element untersuchen) auf der Trefferseite pruefen
#   und ueber /admin/portals/{name}/edit anpassen.
#
#   Engine-Familien:
#     1. Cosinex VMP Satellite -> /VMPSatellite/notice/search?searchTerm=X
#        Brandenburg, Sachsen-Anhalt, Thueringen, Schleswig-Holstein,
#        Mecklenburg-Vorpommern (teilweise)
#     2. Cosinex VMP Center    -> /VMPCenter/notice/search?searchTerm=X
#        NRW, Rheinland-Pfalz, Saarland, Hamburg
#     3. Vergabemarktplatz Berlin (Spezial)
#     4. evergabe.sachsen.de (NetServer)
#     5. DTVP (Healy-Hudson)
#     6. evergabe.de / evergabe-online.de (Bund/Cosinex)
#     7. Auftragsboerse Bayern
#
# Felder:
#   strategy : api | rss | search_url | scrape
#   scraper  : Modulname unter scrapers/ (snake_case -> CamelCaseScraper)

portals:

  # =====================================================================
  # Bund / EU - hochwertig, eigene Scraper
  # =====================================================================

  - name: "bund.de Service-Portal"
    enabled: true
    scraper: "bund"
    base_url: "https://www.service.bund.de"
    strategy: "search_url"
    notes: "Bekanntmachungen des Bundes - eigener Scraper, stabil."

  - name: "TED - Tenders Electronic Daily"
    enabled: true
    scraper: "ted"
    base_url: "https://api.ted.europa.eu"
    strategy: "api"
    notes: "Offizielle TED Search API v3 - kein Key noetig."

  # =====================================================================
  # Bundesweite Cosinex / Bekanntmachungs-Portale
  # =====================================================================

  - name: "evergabe.de (Cosinex)"
    enabled: true
    scraper: "generic_html"
    base_url: "https://www.evergabe.de"
    strategy: "search_url"
    notes: |
      Listing-Modus: Detailseiten brauchen Login, aber die Listing-Seite
      zeigt schon Titel, Beschreibung, Ort, Frist, Kategorie. Wir filtern
      die Karten client-seitig auf unsere Cluster-Begriffe.
      Wenn das Layout sich aendert: F12 auf einer Karte -> CSS-Klasse
      kopieren -> in result_selector hier ergaenzen.
    config:
      listing_paths:
        - "/auftraege"
        - "/auftraege?seite=2"
        - "/auftraege?seite=3"
      filter_by_terms: true
      result_selector: "article, [class*='tender-card'], [class*='auftrag-card'], [class*='result-item'], [class*='search-result'], div.bg-white.rounded, li[class*='auftrag'], section[class*='auftrag']"
      title_selector: "h2 a, h3 a, h2, h3, [class*='title'] a, [class*='title'], a"
      description_selector: "p, [class*='description'], [class*='excerpt'], [class*='summary']"
      # Authority/Location/Deadline kommen automatisch aus den Labels
      # 'Auftraggeber:' / 'Ausführungsort:' / 'Angebotsfrist:' im Karten-Volltext.

  - name: "evergabe-online.de (BMI)"
    enabled: true
    scraper: "crawl_html"
    base_url: "https://www.evergabe-online.de"
    strategy: "scrape"
    notes: "Bund-Laender-Plattform der Beschaffungsstelle des BMI - Crawl-Modus."
    config:
      listing_paths:
        - "/search.html?searchScope=ANNOUNCEMENT"
      link_selector: "a[href*='/announcement/'], a[href*='/notice/'], a.searchResultLink"
      max_details: 60
      request_delay_s: 0.5
      detail_title_selector: "h1, .title, .announcement-title"
      detail_authority_selector: ".authority, .buyer, .vergabestelle"
      detail_location_selector: ".place, .location, .ort"
      detail_deadline_selector: ".deadline, .frist, .submissionDeadline"
      detail_publication_selector: ".publicationDate, .published"

  - name: "DTVP - Deutsches Vergabeportal"
    enabled: true
    scraper: "crawl_html"
    base_url: "https://www.dtvp.de"
    strategy: "scrape"
    notes: "Healy-Hudson - Crawl-Modus."
    config:
      listing_paths:
        - "/Center/notices"
      link_selector: "a[href*='/Center/notice/'], a[href*='/notice/']"
      link_pattern: "/notice/[\\w-]+"
      max_details: 60
      request_delay_s: 0.5
      detail_title_selector: "h1, .notice-title, .title"
      detail_authority_selector: ".buyer, .buyer-name, .organisation"
      detail_location_selector: ".place, .location, .ort"
      detail_deadline_selector: ".deadline, .submission-deadline, .frist"
      detail_publication_selector: ".publication-date, .published"

  # =====================================================================
  # Bundeslaender (alphabetisch)
  # =====================================================================

  - name: "Vergabe Baden-Württemberg"
    enabled: true
    scraper: "generic_html"
    base_url: "https://vergabe.bwl.de"
    strategy: "search_url"
    notes: "Vergabeplattform Baden-Wuerttemberg."
    config:
      search_path: "/?searchterm={term}"
      result_selector: "div.search-result, li.notice, article.tender"
      title_selector: "a.title, h3 a"
      authority_selector: ".buyer, .vergabestelle"
      location_selector: ".place, .ort"
      deadline_selector: ".deadline, .frist"
      description_selector: ".excerpt, .description"

  - name: "Auftragsbörse Bayern"
    enabled: true
    scraper: "generic_html"
    base_url: "https://www.auftraege.bayern.de"
    strategy: "search_url"
    notes: "Bayerische Auftragsboerse."
    config:
      search_path: "/index.php?searchterm={term}"
      result_selector: "tr.bekanntmachung, div.search-result, li.notice"
      title_selector: "a.title, td.title a, h3 a"
      authority_selector: ".buyer, .vergabestelle, td.auftraggeber"
      location_selector: ".place, .ort, td.ort"
      deadline_selector: ".deadline, .frist, td.frist"

  - name: "Vergabeplattform Berlin"
    enabled: true
    scraper: "generic_html"
    base_url: "https://vergabeplattform.berlin.de"
    strategy: "search_url"
    notes: "Berlin VMP Satellite - Listing-Modus mit Volltext-Filter."
    config:
      listing_paths:
        - "/VMPSatellite/notice"
        - "/VMPSatellite/notice?page=2"
      filter_by_terms: true
      result_selector: "div.notice-result, tr.notice, li.notice, article, [class*='notice-item']"
      title_selector: "a.notice-title, a.title, h2 a, h3 a, h2, h3, a"
      description_selector: ".description, .excerpt, p"

  - name: "Vergabemarktplatz Brandenburg"
