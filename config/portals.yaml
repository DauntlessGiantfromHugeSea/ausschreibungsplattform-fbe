# =====================================================================
# Konfigurierte Ausschreibungsportale - DEUTSCHLAND
# =====================================================================
#
# Architektur-Hinweis:
#   Viele Laenderportale teilen sich eine Backend-Engine. Selektoren sind
#   deshalb pro "Engine-Familie" sehr aehnlich. Im Zweifel direkt im
#   Browser (F12 -> Element untersuchen) auf der Trefferseite pruefen
#   und ueber /admin/portals/{name}/edit anpassen.
#
#   Engine-Familien:
#     1. Cosinex VMP Satellite -> /VMPSatellite/notice/search?searchTerm=X
#        Brandenburg, Sachsen-Anhalt, Thueringen, Schleswig-Holstein,
#        Mecklenburg-Vorpommern (teilweise)
#     2. Cosinex VMP Center    -> /VMPCenter/notice/search?searchTerm=X
#        NRW, Rheinland-Pfalz, Saarland, Hamburg
#     3. Vergabemarktplatz Berlin (Spezial)
#     4. evergabe.sachsen.de (NetServer)
#     5. DTVP (Healy-Hudson)
#     6. evergabe.de / evergabe-online.de (Bund/Cosinex)
#     7. Auftragsboerse Bayern
#
# Felder:
#   strategy : api | rss | search_url | scrape
#   scraper  : Modulname unter scrapers/ (snake_case -> CamelCaseScraper)

portals:

  # =====================================================================
  # Bund / EU - hochwertig, eigene Scraper
  # =====================================================================

  - name: "bund.de Service-Portal"
    enabled: true
    scraper: "bund"
    base_url: "https://www.service.bund.de"
    strategy: "search_url"
    notes: "Bekanntmachungen des Bundes - eigener Scraper, stabil."

  - name: "TED - Tenders Electronic Daily"
    enabled: true
    scraper: "ted"
    base_url: "https://api.ted.europa.eu"
    strategy: "api"
    notes: "Offizielle TED Search API v3 - kein Key noetig."

  # =====================================================================
  # Bundesweite Cosinex / Bekanntmachungs-Portale
  # =====================================================================

  - name: "evergabe.de (Cosinex)"
    enabled: true
    scraper: "generic_html"
    base_url: "https://www.evergabe.de"
    strategy: "search_url"
    notes: "Cosinex Deutsche eVergabe - oeffentliche Auftragsbekanntmachungen."
    config:
      search_path: "/auftraege?fulltext={term}"
      result_selector: "li.auftrag, div.auftrag, article.tender, div.search-result, tr.tender-row"
      title_selector: "a.title, h3 a, a.tender-link, .auftrag-title a"
      authority_selector: ".buyer, .vergabestelle, .auftraggeber, .organisation"
      location_selector: ".place, .ort, .location, .ausschreibungsort"
      deadline_selector: ".deadline, .frist, .submission-deadline, .angebotsfrist"
      publication_selector: ".published, .veroeffentlicht, .publication-date"
      description_selector: ".excerpt, .description, .teaser, .summary"

  - name: "evergabe-online.de (BMI)"
    enabled: true
    scraper: "generic_html"
    base_url: "https://www.evergabe-online.de"
    strategy: "search_url"
    notes: "Bund-Laender-Plattform der Beschaffungsstelle des BMI."
    config:
      search_path: "/search.html?searchScope=ANNOUNCEMENT&inputSearchterm={term}"
      result_selector: "div.searchResultItem, li.searchResult, tr.searchResultRow, div.result"
      title_selector: "a.searchResultLink, h3 a, a.title"
      authority_selector: ".authority, .buyer, .vergabestelle"
      location_selector: ".place, .ort, .location"
      deadline_selector: ".deadline, .frist, .submissionDeadline, .endTime"
      publication_selector: ".publicationDate, .publication, .veroeffentlicht"
      description_selector: ".excerpt, .description, .teaser"

  - name: "DTVP - Deutsches Vergabeportal"
    enabled: true
    scraper: "generic_html"
    base_url: "https://www.dtvp.de"
    strategy: "search_url"
    notes: "Healy-Hudson Vergabeportal."
    config:
      search_path: "/Center/notices/search?fulltext={term}"
      result_selector: "div.notice-tile, tr.notice-row, li.notice, div.search-result"
      title_selector: "a.notice-title, a.title, h3 a"
      authority_selector: ".buyer-name, .organisation, .buyer"
      location_selector: ".place, .location, .ort"
      deadline_selector: ".deadline, .submission-deadline, .frist"
      publication_selector: ".publication-date, .published"
      description_selector: ".description, .excerpt"

