  # KERN-CLUSTER (very_high) - FBE-Kerngeschaeft. Ein Treffer hier
  # garantiert HIGH-Score, da 30 Cluster-Punkte + 30 Kernthema-Bonus
  # + 10 Frist-Bonus >= 60 (HIGH-Schwelle).
  # =====================================================================

