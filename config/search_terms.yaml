# Suchbegriffe gruppiert nach Themencluster.
# weight: very_high (30) | high (20) | medium (10) | low (4)
# Synonyme werden case-insensitive geprueft. Komposita matchen mit linker
# Wortgrenze ('Tiefbau' findet 'Tiefbauarbeiten').
# Begriffe sind cluster-eindeutig (kein Begriff in zwei Clustern).

clusters:
